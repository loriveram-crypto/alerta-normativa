name: Vigilancia Normativa

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  vigilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ejecutar vigilancia
        run: python main.py

      - name: Guardar cambios (Excel y estado) de vuelta al repositorio
        run: |
          git config user.name "vigilancia-bot"
          git config user.email "vigilancia-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Actualizar vigilancia normativa $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
